name: Compilar BlissOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Maximizar Espaço em Disco
      uses: easimon/maximize-build-space@v8
      with:
        root-reserve-mb: 5120
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'

    - name: Instalar Dependências de Compilação
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

    - name: Baixar o Código do BlissOS e Compilar
      run: |
        mkdir ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH
        
        mkdir bliss && cd bliss
        repo init -u https://github.com -b bliss-v18.x --depth=1
        repo sync -c -j$(nproc) --no-clone-bundle --no-tags
        
        . build/envsetup.sh
        lunch bliss_x86_64-userdebug
        mka iso_img -j$(nproc)

    - name: Upload da ISO Pronta
      uses: actions/upload-artifact@v4
      with:
        name: BlissOS-ISO
        path: bliss/out/target/product/x86_64/*.iso
